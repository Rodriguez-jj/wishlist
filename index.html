<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e2a3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿 — 支出台帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #ece8dd;
    --paper-deep: #e0dac9;
    --card: #f8f6ef;
    --line: #d6d0bd;
    --line-soft: #e2ddcd;
    --ink: #2a271f;
    --ink-soft: #726c5c;
    --ink-faint: #9a9481;
    --navy: #2b3a55;
    --navy-deep: #1e2a3d;
    --rust: #a84f38;
    --moss: #55744f;
    --gold: #b58a2e;
    --white: #fffefa;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(30,26,15,0.10);
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  /* ダークモード時の視認性を向上 */
  @media (prefers-color-scheme: dark){
    :root{
      --paper: #161512;
      --paper-deep: #0f0e0b;
      --card: #201e1a;
      --line: #3f3a2f;
      --line-soft: #2e2a22;
      --ink: #f0ebd8;
      --ink-soft: #c4bca6;
      --ink-faint: #8f8875;
      --white: #2a271f;
      
      --navy: #7697d6;
      --navy-deep: #172130;
      --rust: #d97a66;
      --moss: #82a87a;
      --gold: #d4a742;
    }
    .cat-toggle{ color: var(--navy); }
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html{ height:100%; }

  body{
    margin:0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    touch-action: manipulation;
  }

  h1,h3,h4{ font-family: "Noto Serif JP", serif; margin:0; font-weight:700; }

  button{ font-family: inherit; cursor:pointer; -webkit-appearance:none; appearance:none; }
  input{ font-family: inherit; }

  .app-shell{
    max-width: 480px;
    margin: 0 auto;
    min-height: 100%;
    background: var(--paper);
    position: relative;
  }
  @media (min-width: 481px){
    .app-shell{ box-shadow: 0 0 0 1px var(--line), 0 8px 40px rgba(0,0,0,0.12); min-height:100vh; }
  }

  /* ---------- Header ---------- */
  .topbar{
    position: sticky;
    top: 0;
    z-index: 30;
    background: var(--navy-deep);
    color: #f1ede0;
    padding-top: calc(10px + var(--safe-top));
    border-bottom: 3px solid var(--gold);
  }
  .topbar-row1{
    display:grid;
    grid-template-columns: 44px 1fr 44px;
    align-items:center;
    padding: 0 4px;
  }
  .topbar-row1 h1{
    font-size: 17px;
    text-align:center;
    color: #f6f2e6;
    letter-spacing: 0.02em;
  }
  .icon-btn{
    width:44px; height:44px;
    display:flex; align-items:center; justify-content:center;
    background:none; border:none;
    color:#f1ede0;
    font-size:20px;
    border-radius: 50%;
  }
  .icon-btn:active{ background: rgba(255,255,255,0.14); }

  .month-nav{
    display:grid;
    grid-template-columns: 48px 1fr 48px;
    align-items:center;
    padding: 2px 4px 10px;
  }
  .month-nav button{
    height:40px;
    background: rgba(255,255,255,0.07);
    border:none;
    color:#f1ede0;
    font-size:20px;
    border-radius: var(--radius-sm);
    margin: 0 6px;
  }
  .month-nav button:active{ background: rgba(255,255,255,0.16); }
  .month-nav span{
    font-family:"Noto Serif JP", serif;
    font-size: 14.5px;
    text-align:center;
    white-space: nowrap;
    overflow:hidden;
    text-overflow: ellipsis;
  }

  /* ---------- Content ---------- */
  .content{
    padding: 14px 14px calc(96px + var(--safe-bottom));
  }

  /* ---------- Welcome ---------- */
  .welcome{
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    margin-top: 30px;
  }
  .welcome h3{ font-size:17px; }
  .welcome p{ color:var(--ink-soft); font-size:13.5px; max-width:320px; line-height:1.7; margin:0; }

  /* ---------- Summary ---------- */
  .summary{
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px 16px 12px;
    margin-bottom: 14px;
  }
  .summary-label{ font-size:12.5px; color:var(--ink-soft); }
  .summary-amount{
    font-family:"Noto Serif JP", serif;
    font-size: clamp(30px, 9vw, 38px);
    color: var(--rust);
    line-height:1.2;
    margin-top:2px;
  }
  .summary-meta{ font-size:12.5px; color:var(--ink-faint); margin-top:2px; }
  .summary-meta b{ color:var(--moss); font-weight:700; }
  .dot-sep{ margin:0 5px; }

  .cat-strip{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding: 12px 2px 2px;
    margin: 0 -2px;
    scrollbar-width:none;
  }
  .cat-strip::-webkit-scrollbar{ display:none; }
  .cat-pill{
    flex: 0 0 auto;
    background: var(--paper-deep);
    border-left: 3px solid var(--navy);
    border-radius: var(--radius-sm);
    padding: 6px 12px;
    min-width: 84px;
  }
  .cat-pill-label{ display:block; font-size:11.5px; color:var(--ink-soft); white-space:nowrap; }
  .cat-pill-amount{ display:block; font-size:13.5px; font-weight:700; margin-top:1px; white-space:nowrap; }

  .cat-toggle{
    display:block;
    width:100%;
    text-align:center;
    background:none;
    border:none;
    color: var(--navy);
    font-size:12.5px;
    font-weight:600;
    padding: 10px 0 4px;
  }
  .cat-full{ margin-top:6px; border-top: 1px dashed var(--line); padding-top:10px; }
  .cat-row{
    display:flex; align-items:center; gap:10px;
    padding: 6px 0;
  }
  .cat-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .cat-row-label{ font-size:13px; white-space:nowrap; min-width:84px; }
  .cat-track{ flex:1; height:6px; background:var(--line-soft); border-radius:4px; overflow:hidden; }
  .cat-fill{ height:100%; border-radius:4px; }
  .cat-row-amount{ font-size:13px; font-weight:700; white-space:nowrap; min-width:74px; text-align:right; }
  .cat-empty{ color:var(--ink-faint); font-size:13px; padding:8px 0; }

  /* ---------- Transactions ---------- */
  .tx-section{ }
  .search-bar{ margin-bottom: 10px; }
  .search-bar input{
    width:100%;
    font-size:16px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--ink);
  }
  .search-bar input:focus{ outline: 2px solid var(--navy); outline-offset: 1px; }

  .tx-list{ display:flex; flex-direction:column; gap:8px; }
  .tx-item{
    display:flex;
    align-items:center;
    gap:10px;
    background: var(--card);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    transition: transform 0.08s ease;
  }
  .tx-item:active{ transform: scale(0.98); background: var(--paper-deep); }
  .tx-dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .tx-info{ flex:1; min-width:0; }
  .tx-payee{ font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tx-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; display:flex; gap:6px; align-items:center; }
  .tx-cat-chip{
    font-size:11px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--paper-deep);
    color: var(--ink-soft);
  }
  .tx-amount{ font-size:15px; font-weight:700; white-space:nowrap; }
  .tx-amount.expense{ color: var(--rust); }
  .tx-amount.income{ color: var(--moss); }
  .tx-del{
    flex-shrink:0;
    width:34px; height:34px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(220,105,70,0.18);
    border:1px solid rgba(235,150,115,0.50);
    color:#f0a080;
    font-size:16px;
    font-weight:800;
    line-height:1;
    border-radius:50%;
    transition: background 0.12s ease, border-color 0.12s ease, transform 0.08s ease, color 0.12s ease;
  }
  .tx-del:hover{ background:rgba(220,105,70,0.30); border-color:#e9a083; color:#ffd9ca; }
  .tx-del:active{ color:#fff; background:#c96b4a; border-color:#e8a084; transform:scale(0.92); }
  .tx-empty{ text-align:center; color:var(--ink-faint); font-size:13.5px; padding: 40px 12px; }

  /* ---------- FAB ---------- */
  .fab{
    position: fixed;
    right: 18px;
    bottom: calc(20px + var(--safe-bottom));
    z-index: 35;
    display:flex; align-items:center; gap:7px;
    background: var(--gold);
    color: #241d0c;
    border:none;
    padding: 14px 20px;
    border-radius: 999px;
    font-weight:700;
    font-size:14px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.28);
    max-width: calc(480px - 36px);
    margin: 0 auto;
  }
  .fab:active{ filter: brightness(0.95); transform: scale(0.97); }
  .fab-icon{ font-size:18px; line-height:1; }

  /* ---------- Bottom sheets ---------- */
  .sheet-overlay{
    position: fixed; inset:0;
    background: rgba(18,15,9,0.5);
    z-index: 70;
    display:flex;
    align-items:flex-end;
    justify-content:center;
  }
  .sheet{
    width:100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 20px 20px 0 0;
    padding: 10px 18px calc(20px + var(--safe-bottom));
    max-height: 85vh;
    overflow-y:auto;
    box-shadow: 0 -8px 28px rgba(0,0,0,0.28);
    animation: sheetUp 0.2s ease-out;
  }
  @keyframes sheetUp{ from{ transform: translateY(24px); opacity:0.4; } to{ transform:translateY(0); opacity:1; } }
  .sheet-handle{ width:36px; height:4px; background:var(--line); border-radius:2px; margin: 2px auto 14px; }

  .sheet-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .sheet-payee{ font-size:15.5px; font-weight:700; }
  .sheet-date{ font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
  .sheet-amount{ font-size:20px; font-weight:700; white-space:nowrap; }
  .sheet-amount.expense{ color:var(--rust); }
  .sheet-amount.income{ color:var(--moss); }

  .sheet-section-label{ font-size:12px; color:var(--ink-soft); margin: 18px 0 8px; letter-spacing:0.02em; }
  .cat-chip-grid{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip{
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--paper-deep);
    color: var(--ink);
    font-size:13.5px;
    font-weight:500;
  }
  .cat-chip.active{ color:#fff; border-color:transparent; font-weight:700; }
  .cat-chip:active{ filter:brightness(0.95); }

  .sheet-delete{
    display:block; width:100%;
    margin-top:20px;
    padding: 13px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--rust);
    background: transparent;
    color: var(--rust);
    font-weight:700;
    font-size:14.5px;
  }
  .sheet-delete:active{ background: rgba(168,79,56,0.1); }
  .sheet-cancel{
    display:block; width:100%;
    margin-top:8px;
    padding: 12px;
    border:none; background:none;
    color: var(--ink-soft);
    font-size:14px;
  }

  .sheet-title-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .sheet-title-row h3{ font-size:16.5px; }
  .sheet-close-x{ width:36px; height:36px; background:none; border:none; font-size:16px; color:var(--ink-soft); }

  .settings-block{ margin-bottom:22px; }
  .settings-block h4{ font-size:12px; color:var(--ink-soft); margin-bottom:10px; letter-spacing:0.02em; }
  .cycle-row{ display:flex; align-items:center; flex-wrap:wrap; gap:7px; font-size:13.5px; color:var(--ink); line-height:1.6; }
  .cycle-row input{
    width:58px; padding:9px 6px; text-align:center;
    font-size:16px;
    border:1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--white); color: var(--ink);
  }

  .cat-manage-list{ display:flex; flex-direction:column; gap:7px; }
  .cat-manage-row{
    display:flex; align-items:center; gap:8px;
    padding: 9px 12px;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    font-size:14px;
  }
  .cat-manage-row span{ flex:1; }
  .cat-manage-row button{ background:none; border:none; color:var(--ink-faint); font-size:15px; padding:4px; }
  .cat-manage-row button:active{ color:var(--rust); }

  .add-cat-row{ display:flex; gap:8px; margin-top:10px; }
  .add-cat-row input{
    flex:1; font-size:16px; padding:10px 12px;
    border:1px solid var(--line); border-radius: var(--radius-sm);
    background: var(--white); color:var(--ink);
  }
  .add-cat-row button{
    background: var(--navy); color:#fff; border:none;
    padding: 0 16px; border-radius: var(--radius-sm);
    font-size:13.5px; font-weight:700;
  }

  .danger-zone{ border-top: 1px dashed var(--line); padding-top:16px; margin-bottom:6px; }
  .danger-zone p{ font-size:12px; color:var(--ink-faint); margin:0 0 10px; line-height:1.6; }
  .danger-btn{
    display:block; width:100%;
    background: var(--white); border:1px solid var(--rust); color:var(--rust);
    padding: 12px; border-radius: var(--radius-sm); font-size:14px; font-weight:700;
  }
  .danger-btn:active{ background: rgba(168,79,56,0.1); }

  /* ---------- Toast ---------- */
  .toast{
    position: fixed;
    bottom: calc(88px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--navy-deep);
    color: #f6f2e6;
    padding: 11px 18px;
    border-radius: 999px;
    font-size: 13px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    z-index: 90;
    max-width: 90%;
    text-align:center;
  }
  .undo-toast{
    display:flex;
    align-items:center;
    gap:12px;
    background:#26231d;
    color:#f7f3e8;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 8px 28px rgba(0,0,0,0.38);
    border-radius:12px;
    padding:10px 12px 10px 15px;
  }
  .undo-toast button{
    flex:0 0 auto;
    border:1px solid rgba(235,150,115,0.60);
    background:rgba(220,105,70,0.22);
    color:#ffc9b4;
    padding:7px 11px;
    border-radius:8px;
    font-size:13px;
    font-weight:700;
  }
  .undo-toast button:active{ background:rgba(220,105,70,0.40); color:#fff; }

  .hidden{ display:none !important; }
</style>
</head>
<body>

<div class="app-shell">

  <header class="topbar">
    <div class="topbar-row1">
      <button class="icon-btn" id="settingsBtn" aria-label="設定">⚙</button>
      <h1>📒 家計簿</h1>
      <span></span>
    </div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="前の期間">‹</button>
      <span id="monthLabel">—</span>
      <button id="nextMonth" aria-label="次の期間">›</button>
    </div>
  </header>

  <main class="content">

    <div id="welcomeState" class="welcome hidden">
      <h3>まずは明細CSVを読み込みましょう</h3>
      <p>右下の「CSV」ボタンから、カード会社や銀行の取引明細CSVを選んでください。データはこの端末のブラウザ内にのみ保存され、外部には送信されません。</p>
    </div>

    <section id="summarySection" class="summary hidden">
      <div class="summary-label">この期間の支出</div>
      <div class="summary-amount" id="totalExpense">¥0</div>
      <div class="summary-meta"><span id="txCount">0件</span><span class="dot-sep">・</span>収入 <b id="totalIncome">¥0</b></div>

      <div class="cat-strip" id="catStrip"></div>
      <button class="cat-toggle hidden" id="catToggleBtn">内訳をすべて見る <span id="catToggleIcon">▾</span></button>
      <div class="cat-full hidden" id="catFull"></div>
    </section>

    <section id="txSection" class="tx-section hidden">
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="取引先で検索" aria-label="取引先で検索">
      </div>
      <div id="txList" class="tx-list"></div>
    </section>

  </main>

  <input type="file" id="csvInput" accept=".csv" hidden>
  <button class="fab" id="fabUpload">
    <span class="fab-icon">＋</span><span>CSVを読み込む</span>
  </button>

</div>

<!-- Transaction action sheet -->
<div id="txSheetOverlay" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div>
        <div class="sheet-payee" id="sheetPayee"></div>
        <div class="sheet-date" id="sheetDate"></div>
      </div>
      <div class="sheet-amount" id="sheetAmount"></div>
    </div>
    <div class="sheet-section-label">カテゴリを選択</div>
    <div class="cat-chip-grid" id="sheetCatGrid"></div>
    <button class="sheet-delete" id="sheetDeleteBtn">この取引を削除</button>
    <button class="sheet-cancel" id="sheetCloseBtn">閉じる</button>
  </div>
</div>

<!-- Settings sheet -->
<div id="settingsOverlay" class="sheet-overlay hidden">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title-row">
      <h3>設定</h3>
      <button class="sheet-close-x" id="settingsCloseBtn">✕</button>
    </div>

    <div class="settings-block">
      <h4>集計期間</h4>
      <div class="cycle-row">
        <span>毎月</span>
        <input type="number" id="cycleStartInput" min="1" max="28">
        <span>日 〜 翌月同日の前日 を1ヶ月として集計（1で暦月）</span>
      </div>
    </div>

    <div class="settings-block">
      <h4>カテゴリ管理</h4>
      <div class="cat-manage-list" id="catManageList"></div>
      <div class="add-cat-row">
        <input type="text" id="newCatInput" placeholder="新しいカテゴリ名">
        <button id="addCatBtn">追加</button>
      </div>
    </div>

    <div class="settings-block danger-zone">
      <p>すべての取引データとカテゴリ設定をこの端末から削除します。この操作は取り消せません。</p>
      <button class="danger-btn" id="resetBtn">全データを削除</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  "use strict";

  /* ================= Storage ================= */
  const KEYS = {
    tx: "kakeibo_transactions_v1",
    catMap: "kakeibo_category_map_v1",
    cats: "kakeibo_categories_v1",
    cycleStart: "kakeibo_cycle_start_day_v1"
  };

  const DEFAULT_CATEGORIES = [
    "食費","日用品","ネットショッピング","フリマ","交通","通信",
    "サブスク","娯楽・趣味","美容・衣服","医療","家賃・住居","水道・光熱","特別な支出","未分類"
  ];

  const GUESS_RULES = [
    [/amazon|アマゾン/i, "ネットショッピング"],
    [/メルカリ|mercari|ヤフオク|ラクマ/i, "フリマ"],
    [/uber ?eats|ubereats|出前館|demae/i, "食費"],
    [/starbucks|スターバックス|ドトール|タリーズ/i, "食費"],
    [/セブン|ローソン|ファミリーマート|ミニストップ|コンビニ/i, "食費"],
    [/イオン|西友|ライフ|マルエツ|スーパー/i, "食費"],
    [/netflix|spotify|amazon ?prime|hulu|disney|youtube ?premium|apple ?music/i, "サブスク"],
    [/jr[^a-z]|地下鉄|メトロ|suica|pasmo|定期券|タクシー|バス/i, "交通"],
    [/東京電力|関西電力|電気|ガス|水道局|水道/i, "水道・光熱"],
    [/家賃|不動産|管理費/i, "家賃・住居"],
    [/薬局|ドラッグ|病院|クリニック|歯科/i, "医療"],
    [/docomo|au |ソフトバンク|softbank|楽天モバイル|ワイモバイル/i, "通信"]
  ];

  function loadJSON(key, fallback){
    try{
      const raw = localStorage.getItem(key);
      if (!raw) return fallback;
      return JSON.parse(raw);
    }catch(e){ return fallback; }
  }
  function saveJSON(key, value){
    try{ localStorage.setItem(key, JSON.stringify(value)); }
    catch(e){ console.error("保存に失敗しました", e); showToast("保存に失敗しました（ストレージ容量の可能性）"); }
  }

  const state = {
    transactions: loadJSON(KEYS.tx, []),
    categoryMap: loadJSON(KEYS.catMap, {}),
    categories: loadJSON(KEYS.cats, DEFAULT_CATEGORIES.slice()),
    cycleStartDay: loadJSON(KEYS.cycleStart, 10),
    currentMonthKey: null,
    searchQuery: "",
    catFullExpanded: false,
    sheetTxId: null
  };

  function saveTransactions(){ saveJSON(KEYS.tx, state.transactions); }
  function saveCategoryMap(){ saveJSON(KEYS.catMap, state.categoryMap); }
  function saveCategories(){ saveJSON(KEYS.cats, state.categories); }
  function saveCycleStartDay(){ saveJSON(KEYS.cycleStart, state.cycleStartDay); }

  /* ================= Utilities ================= */
  function pad2(n){ return String(n).padStart(2,"0"); }

  function monthKeyOf(date){
    const start = state.cycleStartDay || 1;
    let y = date.getFullYear();
    let m = date.getMonth(); 
    if (date.getDate() < start){
      m -= 1;
      if (m < 0){ m = 11; y -= 1; }
    }
    return y + "-" + pad2(m+1);
  }
  function monthLabelOf(key){
    const [y,m] = key.split("-").map(Number);
    const start = state.cycleStartDay || 1;
    if (start === 1){
      return y + "年" + m + "月";
    }
    let endY = y, endM = m + 1;
    if (endM > 12){ endM = 1; endY += 1; }
    const endDay = start - 1;
    return y + "/" + m + "/" + start + " 〜 " + endY + "/" + endM + "/" + endDay;
  }
  function shiftMonthKey(key, delta){
    const [y,m] = key.split("-").map(Number);
    let idx = (m - 1) + delta;
    let newY = y + Math.floor(idx/12);
    const newM = ((idx % 12) + 12) % 12;
    return newY + "-" + pad2(newM+1);
  }

  function hashCode(str){
    let h = 0;
    for (let i=0;i<str.length;i++){
      h = (h<<5) - h + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h).toString(36);
  }

  // カテゴリ色をダークモードに応じて出し分け
  const PALETTE_LIGHT = ["#2b3a55","#a84f38","#55744f","#a07c2c","#6b4e71","#4e7c8b","#7a4e4e","#4f6b3f"];
  const PALETTE_DARK  = ["#6c8ebf","#d97a66","#82a87a","#d4a742","#a885b0","#7eb7cc","#c28888","#89ad73"];
  function colorForCategory(name){
    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const palette = isDark ? PALETTE_DARK : PALETTE_LIGHT;
    return palette[parseInt(hashCode(name),36) % palette.length];
  }

  function formatYen(n){
    return "¥" + Math.round(Math.abs(n)).toLocaleString("ja-JP");
  }

  function showToast(msg, duration){
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> el.classList.add("hidden"), duration || 3000);
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  /* ================= CSV parsing ================= */
  function parseCSVText(text){
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    const rows = [];
    let row = [], field = "", inQuotes = false;
    for (let i=0;i<text.length;i++){
      const c = text[i];
      if (inQuotes){
        if (c === '"'){
          if (text[i+1] === '"'){ field += '"'; i++; }
          else inQuotes = false;
        } else {
          field += c;
        }
      } else {
        if (c === '"'){ inQuotes = true; }
        else if (c === ","){ row.push(field); field = ""; }
        else if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
        else if (c === "\r"){ /* skip */ }
        else { field += c; }
      }
    }
    if (field.length > 0 || row.length > 0){ row.push(field); rows.push(row); }
    return rows.filter(r => !(r.length === 1 && r[0].trim() === ""));
  }

  function normalizeHeader(h){
    return (h || "").replace(/[（(].*?[）)]/g, "").replace(/\s+/g, "").trim();
  }

  const FIELD_PATTERNS = {
    date: ["取引日","日付"],
    withdrawal: ["出金金額","出金"],
    deposit: ["入金金額","入金"],
    country: ["利用国"],
    type: ["取引内容"],
    payee: ["取引先"],
    method: ["支払方法","支払い方法"],
    payCategory: ["支払い区分","支払区分"],
    user: ["利用者"],
    txId: ["取引番号","取引ID"]
  };

  function buildHeaderIndex(headerRow){
    const idx = {};
    const normalized = headerRow.map(normalizeHeader);
    Object.keys(FIELD_PATTERNS).forEach(field=>{
      const patterns = FIELD_PATTERNS[field];
      for (let i=0;i<normalized.length;i++){
        if (patterns.some(p => normalized[i].indexOf(p) !== -1)){
          idx[field] = i;
          break;
        }
      }
    });
    return idx;
  }

  function parseAmount(v){
    if (v === undefined || v === null) return 0;
    v = String(v).trim();
    if (v === "" || v === "-" || v === "ー" || v === "‐") return 0;
    v = v.replace(/[¥￥,\s]/g, "");
    const n = parseFloat(v);
    return isNaN(n) ? 0 : Math.abs(n);
  }

  function parseDateValue(v){
    if (!v) return null;
    const m = String(v).match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})日?(?:[ T](\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?/);
    if (!m) return null;
    const [, y, mo, d, hh, mi, ss] = m;
    return new Date(
      parseInt(y,10), parseInt(mo,10)-1, parseInt(d,10),
      hh ? parseInt(hh,10) : 0, mi ? parseInt(mi,10) : 0, ss ? parseInt(ss,10) : 0
    );
  }

  function decodeBuffer(buffer){
    try{
      const utf8 = new TextDecoder("utf-8", { fatal: true });
      return utf8.decode(buffer);
    }catch(e){
      try{
        const sjis = new TextDecoder("shift_jis");
        return sjis.decode(buffer);
      }catch(e2){
        return new TextDecoder("utf-8", { fatal:false }).decode(buffer);
      }
    }
  }

  function guessCategory(payee){
    if (!payee) return "未分類";
    if (state.categoryMap[payee]) return state.categoryMap[payee];
    for (const key in state.categoryMap){
      if (key && (payee.indexOf(key) !== -1 || key.indexOf(payee) !== -1)){
        return state.categoryMap[key];
      }
    }
    for (const [re, cat] of GUESS_RULES){
      if (re.test(payee) && state.categories.indexOf(cat) !== -1) return cat;
    }
    return "未分類";
  }

  function rowsToTransactions(rows){
    if (rows.length < 2) return [];
    const idx = buildHeaderIndex(rows[0]);
    if (idx.date === undefined){ return null; }
    const out = [];
    for (let r = 1; r < rows.length; r++){
      const row = rows[r];
      if (!row || row.every(c => (c||"").trim() === "")) continue;
      const dateRaw = idx.date !== undefined ? row[idx.date] : "";
      const dateObj = parseDateValue(dateRaw);
      if (!dateObj || isNaN(dateObj.getTime())) continue;

      const withdrawal = idx.withdrawal !== undefined ? parseAmount(row[idx.withdrawal]) : 0;
      const deposit = idx.deposit !== undefined ? parseAmount(row[idx.deposit]) : 0;
      const payee = idx.payee !== undefined ? (row[idx.payee]||"").trim() : "";
      const type = idx.type !== undefined ? (row[idx.type]||"").trim() : "";
      const country = idx.country !== undefined ? (row[idx.country]||"").trim() : "";
      const method = idx.method !== undefined ? (row[idx.method]||"").trim() : "";
      const payCategory = idx.payCategory !== undefined ? (row[idx.payCategory]||"").trim() : "";
      const user = idx.user !== undefined ? (row[idx.user]||"").trim() : "";
      const txId = idx.txId !== undefined ? (row[idx.txId]||"").trim() : "";

      if (withdrawal === 0 && deposit === 0) continue;

      const displayName = payee || type || "（取引先不明）";
      const id = txId ? ("id:" + txId) : ("gen:" + hashCode(dateRaw + "|" + withdrawal + "|" + deposit + "|" + displayName));

      out.push({
        id: id,
        date: dateObj.toISOString(),
        withdrawal: withdrawal,
        deposit: deposit,
        payee: displayName,
        type: type,
        country: country,
        method: method,
        payCategory: payCategory,
        user: user,
        category: guessCategory(displayName)
      });
    }
    return out;
  }

  function mergeTransactions(newTx){
    const existingIds = new Set(state.transactions.map(t => t.id));
    let added = 0, skipped = 0;
    newTx.forEach(t => {
      if (existingIds.has(t.id)){ skipped++; return; }
      existingIds.add(t.id);
      state.transactions.push(t);
      added++;
    });
    state.transactions.sort((a,b)=> new Date(b.date) - new Date(a.date));
    saveTransactions();
    return { added, skipped };
  }

  function handleCSVFile(file){
    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const text = decodeBuffer(e.target.result);
        const rows = parseCSVText(text);
        const newTx = rowsToTransactions(rows);
        if (newTx === null){
          showToast("CSVの列を認識できませんでした。列名をご確認ください。", 4200);
          return;
        }
        if (newTx.length === 0){
          showToast("読み込める取引が見つかりませんでした。");
          return;
        }
        const { added, skipped } = mergeTransactions(newTx);
        const months = getAvailableMonths();
        if (months.length){ state.currentMonthKey = months[months.length-1]; }
        renderAll();
        showToast(added + "件を読み込みました" + (skipped ? "（重複" + skipped + "件はスキップ）" : ""));
      }catch(err){
        console.error(err);
        showToast("CSVの読み込み中にエラーが発生しました。");
      }
    };
    reader.onerror = function(){ showToast("ファイルの読み込みに失敗しました。"); };
    reader.readAsArrayBuffer(file);
  }

  /* ================= Rendering ================= */
  function getAvailableMonths(){
    const set = new Set(state.transactions.map(t => monthKeyOf(new Date(t.date))));
    return Array.from(set).sort();
  }

  function currentMonthTx(){
    return state.transactions.filter(t => monthKeyOf(new Date(t.date)) === state.currentMonthKey);
  }

  function renderAll(){
    const hasAny = state.transactions.length > 0;
    document.getElementById("welcomeState").classList.toggle("hidden", hasAny);
    document.getElementById("summarySection").classList.toggle("hidden", !hasAny);
    document.getElementById("txSection").classList.toggle("hidden", !hasAny);

    if (!hasAny){
      document.getElementById("monthLabel").textContent = "—";
      return;
    }

    if (!state.currentMonthKey){
      const months = getAvailableMonths();
      state.currentMonthKey = months[months.length-1];
    }
    document.getElementById("monthLabel").textContent = monthLabelOf(state.currentMonthKey);

    const monthTx = currentMonthTx();
    renderSummary(monthTx);
    renderTxList(monthTx);
  }

  function renderSummary(monthTx){
    const totalExpense = monthTx.reduce((s,t)=> s + t.withdrawal, 0);
    const totalIncome = monthTx.reduce((s,t)=> s + t.deposit, 0);
    const expenseCount = monthTx.filter(t => t.withdrawal > 0).length;

    document.getElementById("totalExpense").textContent = formatYen(totalExpense);
    document.getElementById("txCount").textContent = expenseCount + "件";
    document.getElementById("totalIncome").textContent = formatYen(totalIncome);

    const byCat = {};
    monthTx.forEach(t=>{
      if (t.withdrawal <= 0) return;
      byCat[t.category] = (byCat[t.category] || 0) + t.withdrawal;
    });
    const entries = Object.entries(byCat).sort((a,b)=> b[1]-a[1]);
    const max = entries.length ? entries[0][1] : 0;

    const strip = document.getElementById("catStrip");
    const toggleBtn = document.getElementById("catToggleBtn");
    const full = document.getElementById("catFull");

    strip.innerHTML = "";
    full.innerHTML = "";

    if (!entries.length){
      const div = document.createElement("div");
      div.className = "cat-empty";
      div.textContent = "この期間の支出データはありません";
      strip.appendChild(div);
      toggleBtn.classList.add("hidden");
      full.classList.add("hidden");
      return;
    }

    const STRIP_LIMIT = 6;
    entries.slice(0, STRIP_LIMIT).forEach(([cat, amount])=>{
      const pill = document.createElement("div");
      pill.className = "cat-pill";
      pill.style.borderLeftColor = colorForCategory(cat);
      pill.innerHTML =
        '<span class="cat-pill-label">' + escapeHTML(cat) + '</span>' +
        '<span class="cat-pill-amount">' + formatYen(amount) + '</span>';
      strip.appendChild(pill);
    });

    entries.forEach(([cat, amount])=>{
      const color = colorForCategory(cat);
      const row = document.createElement("div");
      row.className = "cat-row";
      row.innerHTML =
        '<span class="cat-dot" style="background:' + color + '"></span>' +
        '<span class="cat-row-label">' + escapeHTML(cat) + '</span>' +
        '<span class="cat-track"><span class="cat-fill" style="width:' + (max? (amount/max*100) : 0) + '%;background:' + color + '"></span></span>' +
        '<span class="cat-row-amount">' + formatYen(amount) + '</span>';
      full.appendChild(row);
    });

    toggleBtn.classList.remove("hidden");
    full.classList.toggle("hidden", !state.catFullExpanded);
    document.getElementById("catToggleIcon").textContent = state.catFullExpanded ? "▴" : "▾";
    toggleBtn.childNodes[0].textContent = state.catFullExpanded ? "内訳を閉じる " : "内訳をすべて見る ";
  }

  function renderTxList(monthTx){
    const query = state.searchQuery.trim().toLowerCase();
    const filtered = query
      ? monthTx.filter(t => t.payee.toLowerCase().indexOf(query) !== -1)
      : monthTx;

    const list = document.getElementById("txList");
    list.innerHTML = "";

    if (!filtered.length){
      const div = document.createElement("div");
      div.className = "tx-empty";
      div.textContent = query ? "該当する取引がありません" : "この期間の取引はありません";
      list.appendChild(div);
      return;
    }

    filtered
      .slice()
      .sort((a,b)=> new Date(b.date) - new Date(a.date))
      .forEach(t=>{
        const item = document.createElement("div");
        item.className = "tx-item";

        const d = new Date(t.date);
        const dateStr = (d.getMonth()+1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
        const isExpense = t.withdrawal > 0;
        const amountVal = isExpense ? t.withdrawal : t.deposit;
        const amountStr = (isExpense ? "-" : "+") + formatYen(amountVal);
        const amountClass = isExpense ? "expense" : "income";
        const color = colorForCategory(t.category);

        item.innerHTML =
          '<span class="tx-dot" style="background:' + color + '"></span>' +
          '<div class="tx-info">' +
            '<div class="tx-payee">' + escapeHTML(t.payee) + '</div>' +
            '<div class="tx-meta"><span>' + dateStr + '</span><span class="tx-cat-chip">' + escapeHTML(t.category) + '</span></div>' +
          '</div>' +
          '<div class="tx-amount ' + amountClass + '">' + amountStr + '</div>' +
          '<button class="tx-del" aria-label="削除" title="この明細を削除（あとで元に戻せます）">✕</button>';

        item.addEventListener("click", ()=> openTxSheet(t.id));
        item.querySelector(".tx-del").addEventListener("click", (e)=>{
          e.stopPropagation();
          const deletedTx = {...t};
          state.transactions = state.transactions.filter(x => x.id !== t.id);
          saveTransactions();
          renderAll();
          showUndoToast(deletedTx);
        });
        list.appendChild(item);
      });
  }

  let undoDeleteTimer = null;
  let undoDeletedTransaction = null;
  let undoCategoryTimer = null;
  let undoCategoryData = null;

  function showUndoToast(tx){
    clearTimeout(undoDeleteTimer);
    clearTimeout(undoCategoryTimer);
    clearTimeout(showToast._t);
    
    undoDeletedTransaction = tx;

    const el = document.getElementById("toast");
    el.innerHTML = '<span>「' + escapeHTML(tx.payee || "明細") + '」を削除しました</span><button type="button" id="undoDeleteBtn">元に戻す</button>';
    el.classList.remove("hidden");
    el.classList.add("undo-toast");

    document.getElementById("undoDeleteBtn").onclick = ()=>{
      if (!undoDeletedTransaction) return;
      state.transactions.push(undoDeletedTransaction);
      state.transactions.sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")));
      saveTransactions();
      renderAll();
      undoDeletedTransaction = null;
      clearTimeout(undoDeleteTimer);
      el.classList.add("hidden");
      el.classList.remove("undo-toast");
      el.innerHTML = "";
      showToast("元に戻しました");
    };

    undoDeleteTimer = setTimeout(()=>{
      undoDeletedTransaction = null;
      el.classList.add("hidden");
      el.classList.remove("undo-toast");
      el.innerHTML = "";
    }, 5000);
  }

  function showCategoryUndoToast(catName, catIndex, changedTxIds) {
    clearTimeout(undoDeleteTimer);
    clearTimeout(undoCategoryTimer);
    clearTimeout(showToast._t);

    undoCategoryData = { catName, catIndex, changedTxIds };

    const el = document.getElementById("toast");
    el.innerHTML = '<span>カテゴリ「' + escapeHTML(catName) + '」を削除しました</span><button type="button" id="undoCatBtn">元に戻す</button>';
    el.classList.remove("hidden");
    el.classList.add("undo-toast");

    document.getElementById("undoCatBtn").onclick = () => {
      if (!undoCategoryData) return;
      
      // カテゴリを元の位置に復元
      state.categories.splice(undoCategoryData.catIndex, 0, undoCategoryData.catName);
      
      // 未分類になった取引を元のカテゴリに復元
      const ids = new Set(undoCategoryData.changedTxIds);
      state.transactions.forEach(t => {
        if (ids.has(t.id)) {
          t.category = undoCategoryData.catName;
        }
      });
      
      saveCategories();
      saveTransactions();
      renderCatManageList();
      renderAll();

      undoCategoryData = null;
      clearTimeout(undoCategoryTimer);
      el.classList.add("hidden");
      el.classList.remove("undo-toast");
      el.innerHTML = "";
      showToast("カテゴリを元に戻しました");
    };

    undoCategoryTimer = setTimeout(() => {
      undoCategoryData = null;
      el.classList.add("hidden");
      el.classList.remove("undo-toast");
      el.innerHTML = "";
    }, 5000);
  }

  /* ================= Transaction action sheet ================= */
  function openTxSheet(id){
    const t = state.transactions.find(x => x.id === id);
    if (!t) return;
    state.sheetTxId = id;

    const d = new Date(t.date);
    const dateStr = d.getFullYear() + "/" + (d.getMonth()+1) + "/" + d.getDate() + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    const isExpense = t.withdrawal > 0;
    const amountVal = isExpense ? t.withdrawal : t.deposit;

    document.getElementById("sheetPayee").textContent = t.payee;
    document.getElementById("sheetDate").textContent = dateStr;
    const amountEl = document.getElementById("sheetAmount");
    amountEl.textContent = (isExpense ? "-" : "+") + formatYen(amountVal);
    amountEl.className = "sheet-amount " + (isExpense ? "expense" : "income");

    const grid = document.getElementById("sheetCatGrid");
    grid.innerHTML = "";
    state.categories.forEach(cat=>{
      const chip = document.createElement("button");
      chip.className = "cat-chip" + (cat === t.category ? " active" : "");
      chip.textContent = cat;
      if (cat === t.category) chip.style.background = colorForCategory(cat);
      chip.addEventListener("click", ()=>{
        t.category = cat;
        if (t.payee) state.categoryMap[t.payee] = cat;
        saveTransactions();
        saveCategoryMap();
        closeTxSheet();
        renderAll();
        showToast('カテゴリを「' + cat + '」に変更しました');
      });
      grid.appendChild(chip);
    });

    document.getElementById("txSheetOverlay").classList.remove("hidden");
  }
  function closeTxSheet(){
    document.getElementById("txSheetOverlay").classList.add("hidden");
    state.sheetTxId = null;
  }

  document.getElementById("sheetCloseBtn").addEventListener("click", closeTxSheet);
  document.getElementById("txSheetOverlay").addEventListener("click", (e)=>{
    if (e.target.id === "txSheetOverlay") closeTxSheet();
  });
  
  document.getElementById("sheetDeleteBtn").addEventListener("click", ()=>{
    if (!state.sheetTxId) return;
    // confirmアラートを廃止し、Undoトーストへ移行
    const deletedTx = state.transactions.find(x => x.id === state.sheetTxId);
    state.transactions = state.transactions.filter(x => x.id !== state.sheetTxId);
    saveTransactions();
    closeTxSheet();
    renderAll();
    showUndoToast(deletedTx);
  });

  document.getElementById("catToggleBtn").addEventListener("click", ()=>{
    state.catFullExpanded = !state.catFullExpanded;
    renderSummary(currentMonthTx());
  });

  /* ================= Settings sheet ================= */
  function renderCatManageList(){
    const list = document.getElementById("catManageList");
    list.innerHTML = "";
    state.categories.forEach(cat=>{
      const row = document.createElement("div");
      row.className = "cat-manage-row";
      const span = document.createElement("span");
      span.textContent = cat;
      row.appendChild(span);
      if (cat !== "未分類"){
        const btn = document.createElement("button");
        btn.textContent = "✕";
        btn.title = "削除";
        btn.addEventListener("click", ()=>{
          // confirmアラートを廃止し、Undoトーストへ移行
          const catIndex = state.categories.indexOf(cat);
          const changedTxIds = state.transactions.filter(t => t.category === cat).map(t => t.id);

          state.categories = state.categories.filter(c => c !== cat);
          state.transactions.forEach(t => { if (t.category === cat) t.category = "未分類"; });
          saveCategories();
          saveTransactions();
          renderCatManageList();
          renderAll();
          
          showCategoryUndoToast(cat, catIndex, changedTxIds);
        });
        row.appendChild(btn);
      }
      list.appendChild(row);
    });
  }

  function openSettings(){
    renderCatManageList();
    document.getElementById("cycleStartInput").value = state.cycleStartDay;
    document.getElementById("settingsOverlay").classList.remove("hidden");
  }
  function closeSettings(){
    document.getElementById("settingsOverlay").classList.add("hidden");
  }

  document.getElementById("settingsBtn").addEventListener("click", openSettings);
  document.getElementById("settingsCloseBtn").addEventListener("click", closeSettings);
  document.getElementById("settingsOverlay").addEventListener("click", (e)=>{
    if (e.target.id === "settingsOverlay") closeSettings();
  });

  document.getElementById("cycleStartInput").addEventListener("change", (e)=>{
    let v = parseInt(e.target.value, 10);
    if (isNaN(v)) v = 10;
    v = Math.min(28, Math.max(1, v));
    e.target.value = v;
    state.cycleStartDay = v;
    saveCycleStartDay();
    const months = getAvailableMonths();
    if (months.length) state.currentMonthKey = months[months.length-1];
    renderAll();
    showToast("集計期間を毎月" + v + "日始まりに変更しました");
  });

  document.getElementById("addCatBtn").addEventListener("click", ()=>{
    const input = document.getElementById("newCatInput");
    const name = input.value.trim();
    if (!name) return;
    if (state.categories.indexOf(name) !== -1){ showToast("同じ名前のカテゴリが既にあります"); return; }
    state.categories.splice(state.categories.length-1, 0, name); // keep 未分類 last
    saveCategories();
    input.value = "";
    renderCatManageList();
    renderAll();
  });
  document.getElementById("newCatInput").addEventListener("keydown", (e)=>{
    if (e.key === "Enter") document.getElementById("addCatBtn").click();
  });

  // 全データ削除は非常に危険なため、念のため確認アラートを残しています。
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if (!confirm("本当にすべてのデータを削除しますか？この操作は取り消せません。")) return;
    state.transactions = [];
    state.categoryMap = {};
    state.categories = DEFAULT_CATEGORIES.slice();
    state.currentMonthKey = null;
    state.searchQuery = "";
    saveTransactions(); saveCategoryMap(); saveCategories();
    document.getElementById("searchInput").value = "";
    closeSettings();
    renderAll();
    showToast("すべてのデータを削除しました");
  });

  /* ================= Other events ================= */
  document.getElementById("csvInput").addEventListener("change", function(e){
    const file = e.target.files[0];
    if (file) handleCSVFile(file);
    e.target.value = "";
  });
  document.getElementById("fabUpload").addEventListener("click", ()=>{
    document.getElementById("csvInput").click();
  });

  document.getElementById("prevMonth").addEventListener("click", ()=>{
    if (!state.currentMonthKey) return;
    state.currentMonthKey = shiftMonthKey(state.currentMonthKey, -1);
    renderAll();
  });
  document.getElementById("nextMonth").addEventListener("click", ()=>{
    if (!state.currentMonthKey) return;
    state.currentMonthKey = shiftMonthKey(state.currentMonthKey, 1);
    renderAll();
  });

  document.getElementById("searchInput").addEventListener("input", (e)=>{
    state.searchQuery = e.target.value;
    renderTxList(currentMonthTx());
  });

  // システムのカラーテーマ変更を検知して即座にカテゴリ色を反映
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    renderAll();
    if (!document.getElementById("settingsOverlay").classList.contains("hidden")) {
      renderCatManageList();
    }
  });

  /* ================= Init ================= */
  const months = getAvailableMonths();
  if (months.length) state.currentMonthKey = months[months.length-1];
  renderAll();

})();
</script>
</body>
</html>
